services:
  probe:
    build: .
    user: "${TRACKER_UID:-1000}:${TRACKER_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./.local/seccomp_profile.json
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,size=536870912,mode=1777
    volumes:
      - ../:/repo:ro
      - ./.local/output:/output
    # No exposed port, docker.sock, host network, GitHub token or privileged mode.
