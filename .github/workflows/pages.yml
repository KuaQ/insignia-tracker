name: Deploy dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/**'
      - 'scripts/**'
      - 'config/**'
      - 'archive/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image optimizer (no paid API)
        run: python3 -m pip install pillow==12.3.0
      - name: Validate historical data and portal features
        run: |
          python3 -m unittest discover -s tests -v
          node --check dashboard/features.js
          node tests/test_match.cjs
      - name: Build full dashboard data from historical and current records
        run: python3 scripts/build_dashboard_data.py
      - name: Prepare saved galleries, source links and distances
        run: python3 scripts/prepare_portal.py
      - name: Verify published payload
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('dashboard/data.json').read_text())
          assert len(p['listings']) >= 53, 'Historical records missing'
          assert len({x['key'] for x in p['listings']}) == len(p['listings'])
          for row in p['listings']:
              for archive in row.get('saved_previews', []):
                  for photo in archive['photos']:
                      assert (Path('dashboard') / photo['url'].removeprefix('./')).is_file()
          print('Publishing', len(p['listings']), 'vehicles and', len(p['events']), 'events')
          print('Features:', p['meta']['portal_features'])
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
