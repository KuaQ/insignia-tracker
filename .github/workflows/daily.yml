name: Manual Insignia scraper test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run scraper test
        run: python -m src.main
      - name: Commit test output
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "insignia-tracker[bot]"
          git config user.email "insignia-tracker[bot]@users.noreply.github.com"
          git add data archive
          git commit -m "test: scraper run $(date -u +%F)"
          git push
